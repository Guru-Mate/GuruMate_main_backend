name: Deploy Main Backend via SSM

on:
  push:
    branches: [ "dev" ]

permissions:
  id-token: write # OIDC를 위해 ID 토큰을 발급받을 권한
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      # ... (1~5단계: 체크아웃, JDK 설정, Gradle 빌드, Docker Hub 로그인, 이미지 빌드/푸시) ...
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: tjdqls3607/gurumate_main_backend:dev

      # 6. AWS 자격 증명 설정 (OIDC 사용)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 2단계에서 복사해 둔 역할(Role)의 ARN을 넣습니다.
          role-to-assume: arn:aws:iam::596846156738:role/github-actions-ssm-role # YOUR_AWS_ACCOUNT_ID를 실제 ID로 변경
          aws-region: ap-northeast-2

      # 7. SSM Run Command를 사용하여 EC2에 배포 스크립트 실행
      - name: Deploy to EC2 via SSM
        uses: aws-actions/amazon-ssm-send-command@v1
        with:
          instance-ids: ${{ secrets.EC2_INSTANCE_ID }} # EC2 인스턴스 ID (예: i-012345abcdef)
          command: |
            cd /home/ubuntu/GuruMate_infra
            git pull
            echo "SPRING_PROFILES_ACTIVE=dev" > .env
            echo "SPRING_DATASOURCE_URL=jdbc:postgresql://${{ secrets.RDS_HOST }}:${{ secrets.RDS_PORT }}/${{ secrets.RDS_DB_NAME }}" >> .env
            echo "SPRING_DATASOURCE_USERNAME=${{ secrets.RDS_USERNAME }}" >> .env
            echo "SPRING_DATASOURCE_PASSWORD=${{ secrets.RDS_PASSWORD }}" >> .env
            docker pull tjdqls3607/gurumate-main-backend:dev
            docker-compose up -d --no-deps GuruMate_main_backend