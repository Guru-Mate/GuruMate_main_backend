# .github/workflows/deploy.yml
name: Deploy Main Backend via SSM

on:
  push:
    branches: [ "dev" ]

permissions:
  id-token: write   # OIDC 토큰 발급
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: tjdqls3607/gurumate-main-backend:dev

      # 🔑 OIDC 인증 (IAM Role assume)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::596846156738:role/github-actions-ssm-role
          aws-region: ap-northeast-2

      # 🚀 SSM 명령 전송 (CLI 사용)
      - name: Deploy to EC2 via SSM
        run: |
          aws ssm send-command \
            --targets "Key=instanceIds,Values=${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy GuruMate backend" \
            --parameters 'commands=[
              "cd /home/ubuntu/GuruMate_infra",
              "git pull",
              "echo SPRING_PROFILES_ACTIVE=dev > .env",
              "echo SPRING_DATASOURCE_URL=jdbc:postgresql://${{ secrets.RDS_HOST }}:${{ secrets.RDS_PORT }}/${{ secrets.RDS_DB_NAME }} >> .env",
              "echo SPRING_DATASOURCE_USERNAME=${{ secrets.RDS_USERNAME }} >> .env",
              "echo SPRING_DATASOURCE_PASSWORD=${{ secrets.RDS_PASSWORD }} >> .env",
              "docker pull tjdqls3607/gurumate-main-backend:dev",
              "docker-compose up -d --no-deps main_backend"
            ]'
